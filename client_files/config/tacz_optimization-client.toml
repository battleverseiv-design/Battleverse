
[render]
	#Disable rendering of weapons in other player's hands (except your own)
	DisableOtherPlayersWeaponRender = false
	#Disable rendering of your own bullets/projectiles
	DisableOwnBulletRender = false
	#Disable rendering of other player's bullets/projectiles (including tracers)
	DisableOtherPlayersBulletRender = false
	#Disable rendering of attachments/modules on other player's weapons (your own attachments will still be visible)
	DisableOtherPlayersAttachmentsRender = true

[gui]
	#Disable Gun HUD overlay (ammo count, fire mode, etc.)
	DisableGunHudOverlay = false
	#Disable Heat Bar overlay
	DisableHeatBarOverlay = false
	#Disable Kill Amount overlay
	DisableKillAmountOverlay = true
	#Disable Interact Key text overlay
	DisableInteractKeyOverlay = true

